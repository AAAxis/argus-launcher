<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Argys Cookie Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Cookies</h1>
    <button id="export-domain">Export current site</button>
    <label class="import">
      <span>Import JSON</span>
      <input id="import-file" type="file" accept=".json,application/json">
    </label>
    <p id="status">Ready</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
