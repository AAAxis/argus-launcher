<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Argus Cookie Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img class="app-icon" src="icons/icon-32.png" alt="" width="20" height="20">
      <h1>Cookies</h1>
      <span id="profile-chip" class="chip" hidden></span>
    </header>

    <!-- Sync state is the headline (Task 7 brief): every reachable/token/
         rate-limit/internal state the engine can persist gets its own
         copy here, driven by popup.js's classifySync(), not just the badge's
         reduced glyph set. -->
    <section id="sync-card" class="card">
      <div class="card-row">
        <span id="sync-icon" class="status-icon" aria-hidden="true"></span>
        <div class="card-text">
          <strong id="sync-title">Checking sync&hellip;</strong>
          <span id="sync-detail"></span>
        </div>
        <label class="switch" title="Auto-sync to Launcher">
          <input id="sync-toggle" type="checkbox" aria-label="Auto-sync to Launcher">
          <span class="slider"></span>
        </label>
      </div>
      <button id="sync-now" class="ghost" type="button">
        <span class="icon" data-icon="refresh"></span>
        Save to Launcher now
      </button>
    </section>

    <div id="seed-status" class="seed-status">
      <span id="seed-icon" class="mini-icon" aria-hidden="true"></span>
      <span id="seed-text"></span>
    </div>

    <div class="stats">
      <div class="stat">
        <span id="site-count" class="stat-number">0</span>
        <small id="site-label">This site</small>
      </div>
      <div class="stat">
        <span id="total-count" class="stat-number">0</span>
        <small>Total cookies</small>
      </div>
    </div>

    <button id="open-editor" class="primary" type="button">
      <span class="icon" data-icon="edit"></span>
      Open cookie editor
    </button>
    <button id="pull" type="button">
      <span class="icon" data-icon="download"></span>
      Load from Launcher
    </button>

    <div class="row">
      <div class="menu-wrap">
        <button id="export-menu-button" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="icon" data-icon="upload"></span>
          Export
        </button>
        <div id="export-menu" class="menu" hidden role="menu">
          <button data-scope="all" data-format="json" type="button" role="menuitem">All cookies &middot; JSON</button>
          <button data-scope="all" data-format="netscape" type="button" role="menuitem">All cookies &middot; Netscape</button>
          <button data-scope="site" data-format="json" type="button" role="menuitem">Current site &middot; JSON</button>
          <button data-scope="all" data-format="clipboard" type="button" role="menuitem">Copy JSON to clipboard</button>
        </div>
      </div>
      <label id="import-label" class="import-label" for="import-file">
        <span class="icon" data-icon="upload-tray"></span>
        Import
        <input id="import-file" type="file" accept=".json,.txt,.cookies,application/json,text/plain">
      </label>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="cookie-format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
