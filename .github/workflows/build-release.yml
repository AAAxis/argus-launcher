name: Build Electron releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  R2_ENDPOINT: https://fdbfca2be2ba5fdd40b274450f22c6ad.r2.cloudflarestorage.com
  R2_BUCKET: global
  UPDATE_FEED_URL: ${{ vars.R2_PUBLIC_URL || 'https://pub-a6c0e96f900b4b698762591fddd497aa.r2.dev' }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure update feed
        shell: bash
        run: |
          if [ -z "${UPDATE_FEED_URL}" ]; then
            echo "Missing repository variable: R2_PUBLIC_URL"
            exit 1
          fi
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.build.publish=[{provider:'generic',url:process.env.UPDATE_FEED_URL.replace(/\\/$/,'')}]; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"

      - name: Configure notarization
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # notarytool rejects Apple ID + app-specific-password auth without an
        # explicit teamId (see @electron/notarize's validate-args.js), so it
        # has to be injected here rather than left as `notarize: true`.
        # (Guarded with a shell `if`, not a step-level `if:`, because the
        # `secrets` context isn't allowed in step conditionals.)
        run: |
          if [ -n "$APPLE_TEAM_ID" ]; then
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.build.mac.notarize={teamId:process.env.APPLE_TEAM_ID}; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
          fi

      - name: Write release notes
        shell: bash
        # electron-builder picks up build/release-notes.md automatically and
        # writes it into latest.yml's releaseNotes field, which the app's
        # update toast displays. Falls back to the commit subject if this
        # release's commit has no body.
        run: |
          mkdir -p build
          git log -1 --format=%b > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            git log -1 --format=%s > build/release-notes.md
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Build DMG
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # GitHub Actions passes secrets that were never set as empty strings,
        # not as unset vars. electron-builder treats an empty-but-present
        # CSC_LINK as "sign with this" rather than "skip signing", which
        # crashes the build. Until the signing secrets exist, unset them
        # entirely so this produces an unsigned (but successful) build.
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK not set; building unsigned."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: argys-anty-macos
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure update feed
        shell: bash
        run: |
          if [ -z "${UPDATE_FEED_URL}" ]; then
            echo "Missing repository variable: R2_PUBLIC_URL"
            exit 1
          fi
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.build.publish=[{provider:'generic',url:process.env.UPDATE_FEED_URL.replace(/\\/$/,'')}]; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"

      - name: Write release notes
        shell: bash
        # electron-builder picks up build/release-notes.md automatically and
        # writes it into latest.yml's releaseNotes field, which the app's
        # update toast displays. Falls back to the commit subject if this
        # release's commit has no body.
        run: |
          mkdir -p build
          git log -1 --format=%b > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            git log -1 --format=%s > build/release-notes.md
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Build EXE
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows updater files to R2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          set -euo pipefail
          aws s3 cp release/latest.yml "s3://${R2_BUCKET}/latest.yml" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "public, max-age=60"
          for file in release/Argys-Anty-*-win-x64.exe*; do
            aws s3 cp "${file}" "s3://${R2_BUCKET}/$(basename "${file}")" \
              --endpoint-url "${R2_ENDPOINT}" \
              --cache-control "public, max-age=60"
          done

      - name: Upload Windows artifact
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: argys-anty-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    name: Publish tagged release
    needs:
      - build-mac
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release-artifacts/*
          fail_on_unmatched_files: true

      - name: Upload updater files to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          aws s3 cp release-artifacts/latest.yml "s3://${R2_BUCKET}/latest.yml" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "public, max-age=60"
          for file in release-artifacts/Argys-Anty-*-win-x64.exe*; do
            aws s3 cp "${file}" "s3://${R2_BUCKET}/$(basename "${file}")" \
              --endpoint-url "${R2_ENDPOINT}" \
              --cache-control "public, max-age=60"
          done
          if [ -n "${CSC_LINK}" ]; then
            aws s3 cp release-artifacts/latest-mac.yml "s3://${R2_BUCKET}/latest-mac.yml" \
              --endpoint-url "${R2_ENDPOINT}" \
              --cache-control "public, max-age=60"
            for file in release-artifacts/Argys-Anty-*-mac-arm64.*; do
              aws s3 cp "${file}" "s3://${R2_BUCKET}/$(basename "${file}")" \
                --endpoint-url "${R2_ENDPOINT}" \
                --cache-control "public, max-age=60"
            done
          else
            echo "CSC_LINK is not set; skipping mac updater upload to avoid unsigned ShipIt updates."
          fi
